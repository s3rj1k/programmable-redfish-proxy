[package]
name = "programmable-redfish-proxy"
version = "0.1.0"
edition = "2024"
description = "Standalone authenticating-relay reverse proxy for Redfish BMCs, with Rune-scripted endpoints"
license = "Unlicense"
repository = "https://github.com/s3rj1k/programmable-redfish-proxy"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
# No `http2`. The listener serves HTTP/1.1 only, as does the upstream client.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
# Already in the tree through rustls and reqwest, so declaring it costs no crate.
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
http = "1"
humantime-serde = "1"
# A runtime dependency now, for the HTTP/1.1 server builder. hyper-util's
# `server-auto` hard-requires http2, which would compile an h2 we never serve.
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "json",
] }
# Digests for the script helpers. Already the crypto provider, so `sha2` would
# add six crates for what this one already does.
ring = "0.17"
# Mints the listener certificate when no path is configured. Pinned to `ring`,
# because a second crypto provider leaves rustls no way to pick a default.
rcgen = { version = "0.14", default-features = false, features = [
  "crypto",
  "pem",
  "ring",
] }
rune = "0.14"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `not_before`/`not_after` are `time` types and rcgen does not re-export them.
# Already in the tree through rcgen, so naming it costs no extra crate.
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["full"] }
# Deliberately `ring` only. With `aws-lc-rs` enabled as well there are two
# providers, and rustls then refuses to pick a process-level default.
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
# The harness only, for building and reading streamed bodies.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# Pedantic is gated, nursery is not. Nursery lints are documented as possibly
# buggy, and `option_if_let_else` in particular often reads worse.
pedantic = { level = "warn", priority = -1 }

# A 105-line harness function is fine, and the two-arm match in `handle` states
# the two request paths more clearly than an `if let` would.
too_many_lines = "allow"
single_match_else = "allow"
